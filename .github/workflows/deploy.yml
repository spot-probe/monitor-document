name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A second push during a deploy supersedes it rather than queueing.
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Page dates come from git log; a shallow clone carries no history.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # Direct upload rather than the Pages Git integration: the token below is
      # scoped to Pages alone, and the build that ships is the one this workflow
      # produced.
      # Publishing is a separate concern from the repository being sound. Without the two
      # credentials this step failed the whole run on every push to main; now it says why it
      # skipped and lets the build that already succeeded stand.
      - name: Publish to Cloudflare Pages
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 未配置，跳过发布（构建已完成）"
            exit 0
          fi
          npx wrangler@4 pages deploy dist --project-name monitor-document --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
