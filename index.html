<!doctype html>
<html lang="zh-CN" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- %TITLE% / %DESC% / %CANONICAL% 由 scripts/prerender.mjs 按路由替换；
         直接打开这个文件（开发服务器）时它们是字面量，这是有意的：
         改完记得跑一次 npm run build 才看得到真实值。 -->
    <title>%TITLE%</title>
    <meta name="description" content="%DESC%" />
    <link rel="canonical" href="%CANONICAL%" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Spot Monitor" />
    <meta property="og:url" content="%CANONICAL%" />
    <meta property="og:title" content="%TITLE%" />
    <meta property="og:description" content="%DESC%" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="%TITLE%" />
    <meta name="twitter:description" content="%DESC%" />
    <!-- 与 src/index.css 的 --background 一致（oklch(1 0 0) / oklch(0.145 0 0)） -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <script>
      // Before first paint: a class change after hydration produces a white flash
      // on every navigation for dark-theme readers.
      try {
        var t = localStorage.getItem("theme")
        if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches))
          document.documentElement.classList.add("dark")
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
